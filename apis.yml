name: Deep Genomics
description: Deep Genomics is an AI-driven genetic medicines platform company based in Toronto, Canada.
  It uses biological foundation models (its BioFM Platform) and lab-integrated AI workflows to discover
  and develop RNA-based genetic medicines, combining AI model development, high-throughput screening
  technologies, and information systems to accelerate drug discovery and advance new treatments. Founded
  by deep learning researcher Brendan Frey, the company is backed by investors including Bloomberg Beta and
  SoftBank Vision Fund. It surfaces no public developer API, portal, or documentation at this time; this
  profile tracks the company in the API Evangelist network.
